<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shoukan Labs animated sigil">
  <defs>
    <linearGradient id="sigil-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C63FF" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>
  </defs>
  <rect width="180" height="180" fill="none" />
  <circle cx="90" cy="90" r="78" fill="none" stroke="url(#sigil-g)" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" values="0;24" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="90" cy="90" r="56" fill="none" stroke="url(#sigil-g)" stroke-width="2" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.4s" repeatCount="indefinite" />
